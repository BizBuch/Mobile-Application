name: 📱 Build iOS App

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "shared/**"
      - "package.json"
      - "yarn.lock"
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - "shared/**"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Release (Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build iOS Release (Simulator)
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace startup_overflow.xcworkspace \
            -scheme startup_overflow \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: mobile/ios/build/Build/Products/Release-iphonesimulator/
